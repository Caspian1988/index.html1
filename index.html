<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route 6 Tracker</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      text-align: center;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #00e676;
    }
    p.subtitle {
      margin: 4px 0 0 0;
      font-size: 0.85rem;
      color: #aaa;
    }
    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }
    button {
      background-color: #00e676;
      color: #121212;
      border: none;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    button:disabled {
      background-color: #444;
      color: #888;
    }
    .status-text {
      font-size: 0.9rem;
      color: #bbb;
      margin-top: 6px;
    }
    .trip-count {
      font-size: 2.5rem;
      font-weight: bold;
      color: #fff;
      text-align: center;
      margin: 10px 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>Route 6 Tracker</h1>
    <p class="subtitle">Developed by Ramin | Montgomery Mall ↔ Parkside</p>
  </header>

  <!-- LIVE WEATHER WIDGET CARD -->
  <div class="card" id="weatherContainer" style="display:none;">
    <div style="font-size: 0.75rem; color: #888; text-transform: uppercase; letter-spacing: 1px;">Current Terminal Weather</div>
    <div style="display: flex; align-items: center; justify-content: space-around; margin-top: 10px;">
      <div id="weatherIcon" style="font-size: 2.5rem;">☀️</div>
      <div style="text-align: left;">
        <div id="tempDisplay" style="font-size: 1.8rem; font-weight: bold; color: #fff;">--°F</div>
        <div id="conditionDisplay" style="font-size: 0.9rem; color: #bbb;">Loading forecast...</div>
      </div>
    </div>
  </div>

  <!-- MAIN SHIFT & TERMINAL TRACKER CARD -->
  <div class="card">
    <div style="font-size: 0.85rem; color: #888;">STATUS</div>
    <div id="terminalStatus" class="status-text">Not Tracking</div>
    <div class="trip-count" id="tripCounter">0</div>
    <div style="text-align: center; font-size: 0.85rem; color: #aaa;">Completed Trips</div>

    <button id="toggleBtn" onclick="toggleTracking()">Start Shift Tracking</button>
  </div>

  <script>
    // --- TERMINALS & GEOFENCING CONFIG ---
    const TERMINALS = {
      PARKSIDE: { name: "Parkside", lat: 39.0225, lon: -77.0972 },
      MALL: { name: "Montgomery Mall", lat: 39.0251, lon: -77.1464 }
    };
    const GEOFENCE_RADIUS_METERS = 150;

    // --- APP STATE ---
    let isTracking = false;
    let watchId = null;
    let wakeLock = null;
    let tripCount = 0;
    let lastTerminal = null;

    // --- HAVERSINE FORMULA (DISTANCE IN METERS) ---
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371000; // Earth radius in meters
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // --- SCREEN WAKE LOCK API ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log('Screen Wake Lock active');
        }
      } catch (err) {
        console.error(`Wake Lock Error: ${err.message}`);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
        console.log('Screen Wake Lock released');
      }
    }

    // Re-apply wake lock if browser tab comes back to foreground
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // --- LIVE WEATHER API CALL (OPEN-METEO) ---
    async function fetchTerminalWeather(lat, lon) {
      const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) return;
        const data = await response.json();

        const temp = Math.round(data.current.temperature_2m);
        const code = data.current.weather_code;

        let icon = '☀️';
        let desc = 'Clear';
        if (code > 0 && code <= 3) { icon = '⛅'; desc = 'Partly Cloudy'; }
        else if (code >= 45 && code <= 48) { icon = '🌫️'; desc = 'Foggy'; }
        else if (code >= 51 && code <= 67) { icon = '🌧️'; desc = 'Rain'; }
        else if (code >= 71 && code <= 77) { icon = '❄️'; desc = 'Snow'; }
        else if (code >= 80 && code <= 99) { icon = '⛈️'; desc = 'Storms'; }

        document.getElementById('weatherContainer').style.display = 'block';
        document.getElementById('weatherIcon').innerText = icon;
        document.getElementById('tempDisplay').innerText = `${temp}°F`;
        document.getElementById('conditionDisplay').innerText = desc;
      } catch (err) {
        console.log("Weather error:", err);
      }
    }

    // --- PROCESS GPS UPDATES ---
    function processLocationUpdate(position) {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      // Fetch live weather for current coordinates
      fetchTerminalWeather(lat, lon);

      // Check proximity to terminals
      const distParkside = getDistanceMeters(lat, lon, TERMINALS.PARKSIDE.lat, TERMINALS.PARKSIDE.lon);
      const distMall = getDistanceMeters(lat, lon, TERMINALS.MALL.lat, TERMINALS.MALL.lon);

      let currentTerminal = null;
      if (distParkside <= GEOFENCE_RADIUS_METERS) currentTerminal = "PARKSIDE";
      if (distMall <= GEOFENCE_RADIUS_METERS) currentTerminal = "MALL";

      const statusEl = document.getElementById('terminalStatus');

      if (currentTerminal) {
        statusEl.innerText = `At ${TERMINALS[currentTerminal].name}`;

        // Count a completed leg when moving from one terminal to the other
        if (lastTerminal && lastTerminal !== currentTerminal) {
          tripCount++;
          document.getElementById('tripCounter').innerText = tripCount;
        }
        lastTerminal = currentTerminal;
      } else {
        statusEl.innerText = "In Transit...";
      }
    }

    // --- TRACKING TOGGLE ---
    function toggleTracking() {
      const btn = document.getElementById('toggleBtn');
      const statusEl = document.getElementById('terminalStatus');

      if (!isTracking) {
        if ("geolocation" in navigator) {
          watchId = navigator.geolocation.watchPosition(
            processLocationUpdate,
            (err) => { statusEl.innerText = `GPS Error: ${err.message}`; },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
          requestWakeLock();
          isTracking = true;
          btn.innerText = "Stop Shift Tracking";
          btn.style.backgroundColor = "#ff5252";
          statusEl.innerText = "Acquiring GPS...";
        } else {
          alert("Geolocation is not supported by your browser.");
        }
      } else {
        if (watchId !== null) navigator.geolocation.clearWatch(watchId);
        releaseWakeLock();
        isTracking = false;
        btn.innerText = "Start Shift Tracking";
        btn.style.backgroundColor = "#00e676";
        statusEl.innerText = "Tracking Stopped";
        document.getElementById('weatherContainer').style.display = 'none';
      }
    }
  </script>
</body>
</html>
