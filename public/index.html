<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Route 6 Trip Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #f5f5f5; text-align: center; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    h1 { font-size: 1.5rem; color: #00e676; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
    .subtitle { font-size: 0.9rem; color: #888; margin-bottom: 20px; }
    
    .card { background: #1e1e1e; border: 1px solid #333; border-radius: 12px; padding: 20px; width: 100%; max-width: 360px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .history-card { margin-top: 15px; }
    .counter { font-size: 4rem; font-weight: bold; color: #ffffff; margin: 10px 0; }
    .label { font-size: 0.85rem; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .status-badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; background: #333; color: #ffd54f; margin-top: 5px; }
    
    .btn { background: #00e676; color: #000; border: none; padding: 14px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; width: 100%; max-width: 360px; cursor: pointer; margin-top: 10px; }
    .btn:active { opacity: 0.8; }
    .btn-reset { background: #ff5252; color: #fff; margin-top: 15px; }
    
    .log-list { text-align: left; list-style: none; margin-top: 10px; font-size: 0.85rem; color: #ccc; max-height: 150px; overflow-y: auto; }
    .log-item { padding: 6px 0; border-bottom: 1px solid #2a2a2a; }
  </style>
</head>
<body>

  <h1>Route 6 Tracker</h1>
  <p class="subtitle">Montgomery Mall ↔ Parkside</p>
  <!-- NEW WEATHER WIDGET CARD -->
  <div class="card" id="weatherContainer" style="display:none; margin-bottom: 10px; border: 1px solid #444;">
    <div style="font-size: 0.8rem; color: #888; text-transform: uppercase;">Current Terminal Forecast</div>
    <div style="display: flex; align-items: center; justify-content: space-around; padding: 10px 0;">
      <div id="weatherIcon" style="font-size: 2rem;">--</div>
      <div>
        <div id="tempDisplay" style="font-size: 1.5rem; font-weight: bold; color: #fff;">--°F</div>
        <div id="conditionDisplay" style="font-size: 0.85rem; color: #bbb;">Loading weather...</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="label">Completed Trips</div>
    <div class="counter" id="tripCount">0</div>
    <div class="label">Current Status</div>
    <div class="status-badge" id="currentStatus">STANDBY</div>
  </div>

  <button class="btn" id="gpsBtn" onclick="toggleGPS()">Start Live GPS Tracking</button>

  <div class="card history-card">
    <div class="label">Trip History</div>
    <ul class="log-list" id="historyList">
      <li class="log-item">No trips logged yet this shift.</li>
    </ul>
    <button class="btn btn-reset" onclick="resetShift()">Reset Shift Counter</button>
  </div>

  <script>
    // --- TERMINALS & GEOFENCE CONFIG ---
    const TERMINALS = {
      MONTGOMERY_MALL: { name: 'Montgomery Mall TC', lat: 39.0264, lon: -77.1378 },
      PARKSIDE: { name: 'Parkside / Grosvenor', lat: 39.0232, lon: -77.1042 }
    };

    let watchId = null;
    let wakeLock = null;

    // Load saved shift data from phone storage
    let shiftData = JSON.parse(localStorage.getItem('route6_shiftData')) || {
      totalTrips: 0,
      lastKnownTerminal: null,
      tripHistory: []
    };

    function saveShiftData() {
      localStorage.setItem('route6_shiftData', JSON.stringify(shiftData));
      updateUI();
    }

    // --- SCREEN WAKE LOCK LOGIC ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log(`Wake Lock Error: ${err.message}`);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release();
        wakeLock = null;
      }
    }

    // --- HAVERSINE DISTANCE MATH ---
    function calculateDistanceInMiles(lat1, lon1, lat2, lon2) {
      const EARTH_RADIUS_MILES = 3958.8;
      const dLat = (lat2 - lat1) * (Math.PI / 180);
      const dLon = (lon2 - lon1) * (Math.PI / 180);

      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * (Math.PI / 180)) *
          Math.cos(lat2 * (Math.PI / 180)) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return EARTH_RADIUS_MILES * c;
    }

    function checkGeofences(currentLat, currentLon, radiusMiles = 0.06) {
      const distMontgomery = calculateDistanceInMiles(currentLat, currentLon, TERMINALS.MONTGOMERY_MALL.lat, TERMINALS.MONTGOMERY_MALL.lon);
      const distParkside = calculateDistanceInMiles(currentLat, currentLon, TERMINALS.PARKSIDE.lat, TERMINALS.PARKSIDE.lon);

      if (distMontgomery <= radiusMiles) return 'MONTGOMERY_MALL';
      if (distParkside <= radiusMiles) return 'PARKSIDE';
      return null;
    }

    // --- PROCESS LIVE GPS UPDATE ---
    function processLocationUpdate(lat, lon) {
      const currentTerminal = checkGeofences(lat, lon);

      if (currentTerminal) {
        if (shiftData.lastKnownTerminal && shiftData.lastKnownTerminal !== currentTerminal) {
          shiftData.totalTrips += 1;
          shiftData.tripHistory.push({
            tripNumber: shiftData.totalTrips,
            from: TERMINALS[shiftData.lastKnownTerminal].name,
            to: TERMINALS[currentTerminal].name,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
        }
        shiftData.lastKnownTerminal = currentTerminal;
        saveShiftData();
      }
    }

    // --- UI UPDATER ---
    function updateUI() {
      document.getElementById('tripCount').innerText = shiftData.totalTrips;
      
      const statusBadge = document.getElementById('currentStatus');
      if (shiftData.lastKnownTerminal) {
        statusBadge.innerText = TERMINALS[shiftData.lastKnownTerminal].name;
      } else {
        statusBadge.innerText = 'IN TRANSIT / STANDBY';
      }

      const historyList = document.getElementById('historyList');
      if (shiftData.tripHistory.length > 0) {
        historyList.innerHTML = shiftData.tripHistory.slice().reverse().map(t => 
          `<li class="log-item">Trip #${t.tripNumber}: ${t.from} ➔ ${t.to} (${t.timestamp})</li>`
        ).join('');
      } else {
        historyList.innerHTML = '<li class="log-item">No trips logged yet this shift.</li>';
      }
    }

    // --- CONTROLS ---
    async function toggleGPS() {
      const btn = document.getElementById('gpsBtn');
      if (watchId === null) {
        if ('geolocation' in navigator) {
          watchId = navigator.geolocation.watchPosition(
            (pos) => processLocationUpdate(pos.coords.latitude, pos.coords.longitude),
            (err) => alert('GPS Error: ' + err.message),
            { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 }
          );
          
          await requestWakeLock(); // Request Screen Wake Lock

          btn.innerText = 'Stop GPS Tracking';
          btn.style.background = '#ff9800';
        } else {
          alert('Geolocation is not supported by your browser.');
        }
      } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        
        releaseWakeLock(); // Release Screen Wake Lock

        btn.innerText = 'Start Live GPS Tracking';
        btn.style.background = '#00e676';
      }
    }

    function resetShift() {
      if (confirm('Reset shift trip counter to 0?')) {
        shiftData = { totalTrips: 0, lastKnownTerminal: null, tripHistory: [] };
        saveShiftData();
      }
    }

    // Re-acquire wake lock if user leaves and returns to browser tab
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await requestWakeLock();
      }
    });

    // Initial render
    updateUI();
  </script>
</body>
</html>
